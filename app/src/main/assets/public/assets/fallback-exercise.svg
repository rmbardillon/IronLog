<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <circle cx="200" cy="150" r="70" fill="#f97316" opacity="0.1" filter="url(#glow)" />

  <!-- Dumbbell Icon -->
  <g transform="translate(140, 90)">
    <!-- Left Weight Plates -->
    <rect x="0" y="20" width="16" height="80" rx="6" fill="url(#orangeGrad)" />
    <rect x="20" y="30" width="12" height="60" rx="4" fill="#fdba74" />

    <!-- Central Bar -->
    <rect x="32" y="54" width="56" height="12" rx="3" fill="#e5e7eb" />
    <!-- Grip Knurling -->
    <line x1="44" y1="54" x2="44" y2="66" stroke="#9ca3af" stroke-width="2" />
    <line x1="52" y1="54" x2="52" y2="66" stroke="#9ca3af" stroke-width="2" />
    <line x1="60" y1="54" x2="60" y2="66" stroke="#9ca3af" stroke-width="2" />
    <line x1="68" y1="54" x2="68" y2="66" stroke="#9ca3af" stroke-width="2" />
    <line x1="76" y1="54" x2="76" y2="66" stroke="#9ca3af" stroke-width="2" />

    <!-- Right Weight Plates -->
    <rect x="88" y="30" width="12" height="60" rx="4" fill="#fdba74" />
    <rect x="104" y="20" width="16" height="80" rx="6" fill="url(#orangeGrad)" />
  </g>
  <text x="200" y="235" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1.5">IRONLOG EXERCISE</text>
</svg>